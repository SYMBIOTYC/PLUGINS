name = "amphetamin-local-integration"
main = "local-integration-worker.mjs"
compatibility_date = "2026-11-28"
workers_dev = false
preview_urls = false

[vars]
COMPUTE_TENANT_ID = "symbiotyc"
COMPUTE_PROJECT_ID = "compute"
MCP_ALLOWED_ORIGINS = ""

[[services]]
binding = "GROUP"
service = "symbiotyc-group-control-plane"

[[d1_databases]]
binding = "RUNTIME_DB"
database_name = "amphetamin-local-runtime-test"
database_id = "00000000-0000-4000-8000-000000000001"
migrations_dir = "migrations"
