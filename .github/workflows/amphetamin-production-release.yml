name: AMPHETAMIN production release

on:
  pull_request:
    paths:
      - "AMPHETAMIN/**"
      - ".github/workflows/amphetamin-production-release.yml"
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Set to yes to deploy the reviewed AMPHETAMIN source to production"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: amphetamin-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AMPHETAMIN
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Install AMPHETAMIN dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run AMPHETAMIN test suite
        run: npm test

      - name: Validate live OAuth discovery (read-only)
        run: node scripts/oauth-preflight.mjs

      - name: Build and validate Worker bundle without deployment
        run: npx --yes wrangler@4.169.0 deploy --dry-run --config wrangler.toml

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == 'yes'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: AMPHETAMIN
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Deploy reviewed Worker to Cloudflare production
        run: npx --yes wrangler@4.169.0 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "8a7eca45979876a80ff1b2a3e82e3c4c"
